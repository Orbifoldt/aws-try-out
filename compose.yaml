services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: aws_try_out
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d aws_try_out"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
